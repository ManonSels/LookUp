{% extends "layout.html" %}

{% block title %}{{ 'Edit' if category else 'New' }} Category - Admin{% endblock %}

{% block content %}
<div class="admin-header">
    <h1>{{ 'Edit' if category else 'Create New' }} Category</h1>
    <a href="{{ url_for('admin.manage_categories') }}" class="btn btn-secondary">Back to Categories</a>
</div>

<form method="POST" class="category-form">
    <div class="form-group">
        <label for="name">Category Name *</label>
        <input type="text" id="name" name="name" value="{{ category.name if category }}" required>
        <small>e.g., "Programming", "Tools", "Linux Commands"</small>
    </div>
    
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">{{ 'Update' if category else 'Create' }} Category</button>
        <a href="{{ url_for('admin.manage_categories') }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
